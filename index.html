<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Budget Planner · Wedding Cost Tracker</title>
<style>
:root{--bg:#FBF7F5;--card:#FFFFFF;--card2:#F6E9EA;--border:#EBD9DA;--text:#3A2A2E;--muted:#8A7377;--accent:#B5566A;--accent-soft:#F8E6E9;
 --green:#5E8C6A;--red:#D9485F;--amber:#C08A2E;--blue:#6C7FB8;--purple:#8E6AAE;--pink:#D97C93;--teal:#4E9A92;--grey:#B8AFB2;--shadow:0 8px 24px rgba(58,42,46,.07);--radius:16px}
[data-theme="dark"]{--bg:#17121A;--card:#211A24;--card2:#2A2130;--border:#3A2E40;--text:#F3E9EE;--muted:#B39FAA;--accent:#E88FA2;--accent-soft:#3A2632;
 --green:#8CC79B;--red:#FF7A8A;--amber:#E9C46A;--blue:#9BB0EE;--purple:#C3A3E6;--pink:#F4A6BB;--teal:#7FD1C7;--grey:#6E6370;--shadow:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1240px;margin:0 auto;padding:20px 20px 70px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.serif{font-family:Georgia,"Times New Roman",serif}
header h1{font-size:28px;font-weight:700;letter-spacing:-.3px}
header h1 i{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}.spacer{flex:1}
.iconbtn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
.iconbtn:hover{border-color:var(--accent)}
nav{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px;position:sticky;top:8px;z-index:5;box-shadow:var(--shadow);margin-bottom:16px;overflow-x:auto}
nav button{border:0;background:transparent;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;flex:none}
nav button.active{background:var(--accent);color:#fff}
[data-theme="dark"] nav button.active{color:#17121A}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,var(--accent-soft),var(--card));border:1px solid var(--border);border-radius:20px;padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.hero .big{font-size:44px;font-weight:800;color:var(--accent);line-height:1}
.hero .lab{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(6,1fr)}.two{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.kpi{border-top:3px solid var(--c,var(--accent))}
.kpi .lab{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.kpi .val{font-size:22px;font-weight:800;color:var(--c,var(--text));margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);margin:22px 0 10px;font-weight:800}
h3{font-size:15px;font-weight:700;margin-bottom:10px}
.list .row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border)}.list .row:last-child{border-bottom:0}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.muted{color:var(--muted)}.grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right{text-align:right}
.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
.pill.ok{background:rgba(94,140,106,.14);color:var(--green)}.pill.warn{background:rgba(192,138,46,.15);color:var(--amber)}.pill.bad{background:rgba(217,72,95,.12);color:var(--red)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
[data-theme="dark"] .btn{color:#17121A}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}.btn.danger{background:var(--red);color:#fff}.btn.sm{padding:5px 10px;font-size:12px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--border);background:var(--card2);position:sticky;top:0}
td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:var(--accent-soft)}
.tablewrap{overflow:auto;max-height:70vh;border-radius:12px;border:1px solid var(--border);background:var(--card)}
.bar{height:8px;background:var(--card2);border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:999px}
.modal{position:fixed;inset:0;background:rgba(30,18,24,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.open{display:flex}.modal .card{width:min(580px,100%);max-height:90vh;overflow:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea,td input,td select{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-weight:500;color:var(--text)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.seg{display:inline-flex;gap:4px}
.seg button{border:1px solid var(--border);background:var(--bg);border-radius:9px;padding:5px 10px;font-weight:700;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button.on[data-v=Yes]{background:rgba(94,140,106,.15);color:var(--green);border-color:var(--green)}
.seg button.on[data-v=No]{background:rgba(217,72,95,.12);color:var(--red);border-color:var(--red)}
.seg button.on[data-v=Pending]{background:rgba(192,138,46,.15);color:var(--amber);border-color:var(--amber)}
.task{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid var(--border)}.task:last-child{border-bottom:0}
.task input{width:18px;height:18px;accent-color:var(--accent)}.task.done .t{text-decoration:line-through;color:var(--muted)}
svg text{fill:var(--muted);font-size:11px}
.empty{color:var(--muted);text-align:center;padding:26px}
.notice{background:var(--accent-soft);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hide{display:none!important}
.fab{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 12px 26px rgba(181,86,106,.4);cursor:pointer;z-index:15}
[data-theme="dark"] .fab{color:#17121A}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.app{padding:12px}header h1{font-size:22px}.kpi .val{font-size:19px}.hero .big{font-size:36px}.hide-sm{display:none}}
@media print{nav,.iconbtn,.toolbar,.fab{display:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1 class="serif" id="title"></h1><div class="sub" id="dateLabel"></div></div>
    <div class="spacer"></div><button class="iconbtn" id="themeBtn">🌙 Dark</button>
  </header>
  <nav id="nav">
    <button data-v="dash" class="active">Dashboard</button><button data-v="items">Budget Items</button><button data-v="pay">Payments</button>
    <button data-v="cats">Categories</button><button data-v="guests">Guests</button><button data-v="check">Checklist</button><button data-v="set">Settings</button>
  </nav>
  <div id="sampleNote" class="notice hide"><b>You're looking at sample data.</b><span class="muted">Explore it, then start your own plan.</span><span class="grow"></span><button class="btn" id="clearSample">Start fresh</button></div>
  <div id="storeNote" class="notice hide">⚠ This browser isn't allowing saved data, so changes last until you close the tab. Use <b>Export backup</b> in Settings to keep them.</div>
  <section id="v-dash"></section><section id="v-items" class="hide"></section><section id="v-pay" class="hide"></section><section id="v-cats" class="hide"></section>
  <section id="v-guests" class="hide"></section><section id="v-check" class="hide"></section><section id="v-set" class="hide"></section>
</div>
<button class="fab" id="fab" title="Add">＋</button>
<div class="modal" id="modal"><div class="card" id="mb"></div></div>
<script>
(function(){
"use strict";
const KEY="weddingBudgetPlanner.v1",THEMEKEY="weddingBudgetPlanner.theme";
const PAL=["#B5566A","#C08A2E","#5E8C6A","#6C7FB8","#8E6AAE","#4E9A92","#D97C93","#D9485F","#9A8F93"];
let S,view="dash",ok=true,pf={q:"",status:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function iso(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function parse(s){if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
const days=s=>Math.round((parse(s)-today())/864e5);
function fd(s,o){const d=typeof s==="string"?parse(s):s;return d?d.toLocaleDateString(undefined,o||{month:"short",day:"numeric",year:"numeric"}):"—"}
function money(v){const c=S.settings.currency||"$";return (v<0?"-":"")+c+Math.round(Math.abs(+v||0)).toLocaleString()}
const pct=(v,d)=>(isFinite(v)?(v*100).toFixed(d==null?0:d):"0")+"%";

// ---------- sample: your script's 8 items, dates relative to today ----------
function sample(){
  const t=today(),wed=new Date(t.getFullYear(),t.getMonth()+10,18),W=n=>iso(addDays(wed,n)),T=n=>iso(addDays(t,n));
  const items=[["Venue","Grand Ballroom Rental","The Royal Palace",5000,5200,"Includes tables and chairs"],["Catering","Dinner & Open Bar (150 guests)","Gourmet Bites Catering",7500,7800,"Per plate cost $52"],
   ["Attire & Beauty","Custom Wedding Dress & Alterations","Bridal Elegance",2000,2150,"Includes veil and shoes"],["Photography","Full Day Photo & Video Package","Memories Captured Co.",3500,3500,"Drone coverage included"],
   ["Entertainment","Live Band & DJ Combo","SoundWave Events",1800,1800,"5-hour reception set"],["Flowers & Decor","Ceremony Arches & Centerpieces","Botanical Dreams",2200,2500,"Seasonal white florals"],
   ["Stationery","Invitations, Menus & Place Cards","Paperie Studio",600,550,"Letterpress printing"],["Favors & Extras","Welcome Bags & Wedding Favors","Custom Craft Shop",400,450,"Local artisanal treats"]]
   .map(a=>({id:uid(),category:a[0],name:a[1],vendor:a[2],contact:"",est:a[3],actual:a[4],notes:a[5]}));
  const paid=[2000,3000,1000,1000,500,800,550,450],depo=[-44,-26,-12,-34,-7,-5,-21,-3],due=[-109,-34,-131,-17,-60,-8,null,null];
  const who=["Bride's Parents","Bride's Parents","Emma & James","Groom's Parents","Emma & James","Groom's Parents","Emma & James","Emma & James"];
  const pays=[];items.forEach((it,i)=>{pays.push({id:uid(),date:T(depo[i]),item:it.id,amount:paid[i],who:who[i],method:i%2?"Card":"Bank transfer",status:"Paid",notes:paid[i]<it.actual?"Deposit":"Paid in full"});
    if(it.actual>paid[i])pays.push({id:uid(),date:W(due[i]),item:it.id,amount:it.actual-paid[i],who:who[i],method:"Bank transfer",status:"Scheduled",notes:"Final balance"})});
  const g=[["Linda & Mark Carter","Bride",2,"Yes","Chicken"],["Sarah Lee","Bride",1,"Yes","Vegetarian"],["Tom & Anna Brooks","Groom",2,"Yes","Beef"],["Grandma Rose","Bride",1,"Yes","Fish"],
   ["The Patel Family","Groom",4,"Pending",""],["Chris Wong","Groom",1,"No",""],["Jess & Ryan Miller","Both",2,"Yes","Chicken"],["Olivia Brown","Bride",1,"Pending",""],
   ["Daniel Kim","Groom",1,"Yes","Vegan"],["Aunt Maria & Uncle Joe","Bride",2,"Yes","Beef"],["Ben & Kate Wilson","Groom",2,"Pending",""],["Priya Shah","Both",1,"Yes","Vegetarian"]]
   .map(x=>({id:uid(),name:x[0],side:x[1],size:x[2],rsvp:x[3],meal:x[4],table:"",thanks:false}));
  const s=blank();s.sample=true;Object.assign(s.settings,{names:"Emma & James",wedding:iso(wed),budget:25000,contingency:10,guests:150});
  s.contributors=[["Emma & James",12000],["Bride's Parents",8000],["Groom's Parents",5000]].map(c=>({id:uid(),name:c[0],pledge:c[1]}));
  s.items=items;s.payments=pays;s.guests=g;
  const doneN=["Set your total budget & contingency","Draft the guest list","Book the venue","Book photographer & videographer","Book caterer","Book band / DJ","Shop for wedding dress","Book florist","Order invitations"];
  s.tasks.forEach(k=>{if(doneN.includes(k.text))k.done=true});return s;
}
function blank(){const t=today();
  const cats=[["Venue",22],["Catering",30],["Attire & Beauty",8],["Photography",12],["Entertainment",7],["Flowers & Decor",9],["Stationery",2.5],["Favors & Extras",1.5],["Rings",3],["Transportation",2],["Officiant & Ceremony",1],["Cake & Desserts",1],["Hair & Makeup",0],["Rentals",0],["Planner / Coordinator",0],["Honeymoon",0],["Gifts",0],["Miscellaneous",0]];
  const tasks=[["Set your total budget & contingency",365],["Draft the guest list",360],["Book the venue",330],["Hire planner / coordinator (optional)",320],["Book photographer & videographer",300],["Book caterer",300],["Book band / DJ",270],["Shop for wedding dress",270],["Book florist",240],["Send save-the-dates",240],["Book officiant",210],["Plan & book honeymoon",180],["Order invitations",150],["Book hair & makeup",150],["Order cake",120],["Buy wedding rings",120],["Book transportation",120],["Send invitations",75],["Final dress fitting",30],["Confirm final guest count with caterer",21],["Create seating chart",21],["Confirm all vendors & timings",14],["Pay final vendor balances",7],["Pack for honeymoon",3],["Relax and enjoy your day!",0]];
  return {sample:false,settings:{names:"Our Wedding",wedding:iso(new Date(t.getFullYear()+1,t.getMonth(),t.getDate())),budget:0,contingency:10,currency:"$",guests:100},
    categories:cats.map(c=>({name:c[0],pct:c[1]})),contributors:[{id:uid(),name:"Couple",pledge:0}],items:[],payments:[],guests:[],
    tasks:tasks.map(x=>({id:uid(),text:x[0],days:x[1],done:false}))}}
function load(){let r=null;try{r=localStorage.getItem(KEY)}catch(e){ok=false}if(r){try{return JSON.parse(r)}catch(e){}}return sample()}
function save(){if(!ok)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){ok=false;$("#storeNote").classList.remove("hide")}}
function commit(){save();render()}

// ---------- maths ----------
const cost=it=>(it.actual===""||it.actual==null)?(+it.est||0):(+it.actual||0);
const paidFor=id=>S.payments.filter(p=>p.item===id&&p.status==="Paid").reduce((a,p)=>a+ +p.amount,0);
const nextFor=id=>S.payments.filter(p=>p.item===id&&p.status==="Scheduled").sort((a,b)=>a.date.localeCompare(b.date))[0];
const itemById=id=>S.items.find(i=>i.id===id);
function itemStatus(it){const c=cost(it),p=paidFor(it.id),n=nextFor(it.id);
  if(n&&days(n.date)<0)return["⚠ Payment overdue","bad"]; if(!c)return["Idea",""]; if(!p)return[it.actual===""||it.actual==null?"Estimating":"Booked · unpaid",""]; return p>=c?["✓ Fully paid","ok"]:["● Deposit paid","warn"]}
function payAlert(p){if(p.status==="Paid")return["✓ Paid","ok"];const d=days(p.date);return d<0?["⚠ Overdue","bad"]:d<=30?["⏰ Due soon","warn"]:["Upcoming",""]}
function totals(){const est=S.items.reduce((a,i)=>a+(+i.est||0),0),com=S.items.reduce((a,i)=>a+cost(i),0),paid=S.payments.filter(p=>p.status==="Paid").reduce((a,p)=>a+ +p.amount,0);
  const b=+S.settings.budget||0,plan=b*(1-(+S.settings.contingency||0)/100);return {est,com,paid,owed:Math.max(0,com-paid),b,plan,leftPlan:plan-com,leftBud:b-com,cush:b-plan}}
const attending=()=>S.guests.filter(g=>g.rsvp==="Yes").reduce((a,g)=>a+(+g.size||0),0);
function catRows(){const T=totals();return S.categories.map((c,i)=>{const its=S.items.filter(x=>x.category===c.name);
  return {c,i,alloc:(+c.pct||0)/100*T.plan,est:its.reduce((a,x)=>a+(+x.est||0),0),act:its.reduce((a,x)=>a+cost(x),0),paid:its.reduce((a,x)=>a+paidFor(x.id),0)}})}

// ---------- charts ----------
function nice(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
function bars(labels,series,stacked){
  const W=540,H=210,pad=44,tot=labels.map((_,i)=>stacked?series.reduce((a,s)=>a+s.v[i],0):Math.max(...series.map(s=>s.v[i]))),max=nice(Math.max(1,...tot)),n=labels.length,bw=(W-pad-8)/n,k=stacked?1:series.length;
  let s=`<svg viewBox="0 0 ${W} ${H+44}" width="100%">`;
  for(let i=0;i<=4;i++){const v=max*i/4,y=H-(v/max)*(H-14);s+=`<line x1="${pad}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--border)"/><text x="${pad-6}" y="${y+4}" text-anchor="end">${v>=1000?(v/1000).toFixed(v%1000?1:0)+"k":v}</text>`}
  labels.forEach((l,i)=>{let base=H;series.forEach((se,j)=>{const v=se.v[i],h=(v/max)*(H-14),w=bw*0.7/k,x=pad+i*bw+bw*0.15+(stacked?0:j*w);
    s+=`<rect x="${x}" y="${(stacked?base:H)-h}" width="${w-1}" height="${Math.max(0,h)}" rx="3" fill="${se.c}"><title>${esc(se.n)} · ${esc(l)}: ${money(v)}</title></rect>`;if(stacked)base-=h});
    const lab=l.length>9?l.slice(0,8)+"…":l;s+=`<text x="${pad+i*bw+bw/2}" y="${H+16}" text-anchor="middle">${esc(lab)}</text>`});
  s+=`<g transform="translate(${pad},${H+36})">`+series.map((se,j)=>`<rect x="${j*110}" y="-9" width="10" height="10" rx="2" fill="${se.c}"/><text x="${j*110+15}" y="0">${esc(se.n)}</text>`).join("")+"</g>";
  return s+"</svg>";
}
function donut(parts,center){const tot=parts.reduce((a,p)=>a+p.v,0);if(!tot)return'<div class="empty">Add budget items to see the split</div>';
  let a=-Math.PI/2,o="";const R=72,r=46,cx=90,cy=90;
  parts.forEach(p=>{if(!p.v)return;const b=a+2*Math.PI*p.v/tot*0.9999,L=(b-a)>Math.PI?1:0,P=(g,q)=>[cx+q*Math.cos(g),cy+q*Math.sin(g)];const[x1,y1]=P(a,R),[x2,y2]=P(b,R),[x3,y3]=P(b,r),[x4,y4]=P(a,r);
    o+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${L} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${L} 0 ${x4} ${y4}Z" fill="${p.c}"><title>${esc(p.l)}: ${money(p.v)}</title></path>`;a=b});
  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><svg viewBox="0 0 180 180" width="180" height="180">${o}<text x="90" y="88" text-anchor="middle" style="font-size:16px;font-weight:800;fill:var(--text)">${esc(center)}</text><text x="90" y="105" text-anchor="middle">committed</text></svg><div class="grow" style="min-width:150px">${parts.map(p=>`<div style="display:flex;gap:8px;align-items:center;margin:5px 0"><span class="dot" style="background:${p.c}"></span><span class="grow ell">${esc(p.l)}</span><b>${pct(p.v/tot)}</b></div>`).join("")}</div></div>`}

// ---------- views ----------
const kpi=(l,v,s,c)=>`<div class="card kpi" style="--c:${c||"var(--text)"}"><div class="lab">${l}</div><div class="val">${v}</div><div class="s2">${s}</div></div>`;
function rDash(){
  const T=totals(),d=days(S.settings.wedding),sched=S.payments.filter(p=>p.status==="Scheduled").sort((a,b)=>a.date.localeCompare(b.date));

  open(`<h3>${n?"Add":"Edit"} guest / party</h3><div class="form"><label class="full">Name<input id="g-name" value="${esc(g.name)}"></label>
   <label>Side<select id="g-side">${["Bride","Groom","Both"].map(x=>`<option ${x===g.side?"selected":""}>${x}</option>`).join("")}</select></label><label>Party size<input id="g-size" type="number" min="1" value="${esc(g.size)}"></label>
   <label>RSVP<select id="g-rsvp">${["Pending","Yes","No"].map(x=>`<option ${x===g.rsvp?"selected":""}>${x}</option>`).join("")}</select></label><label>Meal<input id="g-meal" value="${esc(g.meal)}"></label><label>Table<input id="g-table" value="${esc(g.table)}"></label></div>
   <div class="actions">${n?"":`<button class="btn danger" data-act="delguest" data-id="${g.id}" style="margin-right:auto">Delete</button>`}<button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="saveguest" data-id="${g.id}" data-thanks="${g.thanks?1:0}">Save</button></div>`);$("#g-name").focus()}
function dl(n,t,ty){const b=new Blob([t],{type:ty}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},500)}
const up=(arr,o)=>{const i=arr.findIndex(x=>x.id===o.id);if(i>=0)arr[i]=o;else arr.push(o)};

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  switch(a){
   case "close":close();break;
   case "additem":itemModal();break; case "edititem":itemModal({...itemById(id)});break;
   case "saveitem":{const name=$("#i-name").value.trim();if(!name){$("#i-name").focus();return}const act=$("#i-act").value;
     up(S.items,{id,name,category:$("#i-cat").value,vendor:$("#i-vendor").value.trim(),contact:$("#i-contact").value.trim(),est:+$("#i-est").value||0,actual:act===""?"":+act,notes:$("#i-notes").value.trim()});close();commit();break}
   case "delitem":if(confirm("Delete this item and its payments?")){S.items=S.items.filter(x=>x.id!==id);S.payments=S.payments.filter(p=>p.item!==id);close();commit()}break;
   case "addpay":payModal();break; case "payfor":payModal(null,id);break; case "editpay":payModal({...S.payments.find(p=>p.id===id)});break;
   case "savepay":{const amt=+$("#p-amt").value;if(!(amt>0)){$("#p-err").textContent="Enter an amount above 0.";return}
     up(S.payments,{id,item:$("#p-item").value,amount:Math.round(amt*100)/100,date:$("#p-date").value||iso(today()),status:$("#p-st").value,who:$("#p-who").value,method:$("#p-m").value,notes:$("#p-notes").value.trim()});close();commit();break}
   case "delpay":if(confirm("Delete this payment?")){S.payments=S.payments.filter(p=>p.id!==id);close();commit()}break;
   case "markpaid":{const p=S.payments.find(x=>x.id===id);p.status="Paid";p.date=iso(today());commit();break}
   case "addguest":guestModal();break; case "editguest":guestModal({...S.guests.find(g=>g.id===id)});break;
   case "saveguest":{const name=$("#g-name").value.trim();if(!name)return;up(S.guests,{id,name,side:$("#g-side").value,size:Math.max(1,+$("#g-size").value||1),rsvp:$("#g-rsvp").value,meal:$("#g-meal").value.trim(),table:$("#g-table").value.trim(),thanks:el.dataset.thanks==="1"});close();commit();break}
   case "delguest":if(confirm("Delete this guest?")){S.guests=S.guests.filter(g=>g.id!==id);close();commit()}break;
   case "rsvp":S.guests.find(g=>g.id===id).rsvp=el.dataset.v;commit();break;
   case "addtask":{const t=$("#nt").value.trim();if(!t)return;S.tasks.push({id:uid(),text:t,days:Math.max(0,+$("#nd").value||0),done:false});commit();break}
   case "deltask":S.tasks=S.tasks.filter(t=>t.id!==id);commit();break;
   case "saveset":Object.assign(S.settings,{names:$("#s-names").value.trim()||"Our Wedding",wedding:$("#s-wed").value||S.settings.wedding,budget:+$("#s-bud").value||0,contingency:Math.max(0,+$("#s-cont").value||0),currency:$("#s-cur").value||"$",guests:+$("#s-g").value||0});commit();break;
   case "addc":S.contributors.push({id:uid(),name:"New contributor",pledge:0});commit();break;
   case "delc":S.contributors.splice(+el.dataset.i,1);commit();break;
   case "export":dl("wedding-budget-backup-"+iso(today())+".json",JSON.stringify(S,null,2),"application/json");break;
   case "csv":{const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';dl("wedding-budget-"+iso(today())+".csv",[["Category","Item","Vendor","Estimated","Actual","Paid","Owed","Notes"].map(q).join(",")].concat(S.items.map(i=>[i.category,i.name,i.vendor,i.est,i.actual,paidFor(i.id),Math.max(0,cost(i)-paidFor(i.id)),i.notes].map(q).join(","))).join("\n"),"text/csv");break}
   case "loadsample":if(confirm("Replace your data with the sample?")){S=sample();commit()}break;
   case "reset":if(confirm("Erase everything?")){S=blank();commit()}break;
  }});
document.addEventListener("change",e=>{const el=e.target,a=el.dataset&&el.dataset.act;if(!a)return;
  if(a==="thanks"){S.guests.find(g=>g.id===el.dataset.id).thanks=el.checked;commit()}
  if(a==="tdone"){S.tasks.find(t=>t.id===el.dataset.id).done=el.checked;commit()}
  if(a==="catpct"){S.categories[+el.dataset.i].pct=+el.value||0;commit()}
  if(a==="cf"){const c=S.contributors[+el.dataset.i],f=el.dataset.f,old=c.name;c[f]=f==="pledge"?+el.value||0:el.value;if(f==="name")S.payments.forEach(p=>{if(p.who===old)p.who=c.name});commit()}});
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.v)};
$("#fab").onclick=()=>view==="guests"?guestModal():view==="items"?itemModal():payModal();
$("#clearSample").onclick=()=>{if(confirm("Remove the sample and start your own plan?")){S=blank();commit()}};
$("#modal").onclick=e=>{if(e.target.id==="modal")close()};document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
function setTheme(t){document.documentElement.dataset.theme=t;$("#themeBtn").textContent=t==="dark"?"☀️ Light":"🌙 Dark";try{localStorage.setItem(THEMEKEY,t)}catch(e){}}
$("#themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
S=load();let th="light";try{th=localStorage.getItem(THEMEKEY)||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}
setTheme(th);if(!ok)$("#storeNote").classList.remove("hide");
const h=location.hash.replace("#","");show(["dash","items","pay","cats","guests","check","set"].includes(h)?h:"dash");
})();
</script>
</body>
